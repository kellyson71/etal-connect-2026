name: backend
on:
  push:
    paths: ['backend/**', 'deploy/**', 'prototipo/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**']

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  implantar:
    # Só na main e só se o servidor estiver configurado nos segredos do repositório.
    needs: testes
    if: github.ref == 'refs/heads/main' && vars.IMPLANTAR == 'sim'
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USUARIO }}
          key: ${{ secrets.SSH_CHAVE }}
          script: |
            cd ${{ secrets.PASTA }}
            git pull --ff-only
            cd deploy && docker compose up -d --build
            docker compose exec -T api python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/saude')"
