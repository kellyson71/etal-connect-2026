# Migrações do banco (Alembic). A API aplica as pendentes ao subir (app/db.py, migrar); à mão:
#   .venv/bin/alembic upgrade head            (aplica)
#   .venv/bin/alembic revision --autogenerate -m "o que mudou"   (depois de mudar app/modelos.py)
# O endereço do banco vem de ETAL_BANCO (app/config.py), não daqui.
[alembic]
script_location = %(here)s/migracoes
version_locations = %(here)s/migracoes/versoes
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
