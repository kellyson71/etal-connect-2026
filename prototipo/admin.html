<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel da organização · ETAL Connect</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1b2d5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Seções do painel">
    <a class="side-brand" href="#visao"><img src="assets/icon.svg" alt="" width="30" height="30"><span><b>etal</b> connect<small>Organização</small></span></a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a href="./" target="_blank" rel="noopener">Abrir o app ao lado</a>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="title">Visão geral</h1><p id="clock"></p></div>
      <label class="search"><span class="sr">Buscar participante</span><input id="q" type="search" placeholder="Buscar participante, matrícula ou e-mail" autocomplete="off"></label>
      <button class="btn icon" id="tema" data-act="tema" type="button" aria-label="Trocar o tema"></button><button class="btn primary" data-act="compose" type="button" aria-label="Enviar aviso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>Enviar aviso</span></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="plan-data.js"></script>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
