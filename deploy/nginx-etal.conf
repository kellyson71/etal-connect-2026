# nginx do servidor → app do ETAL (contêiner web na porta PORTA do .env, aqui 8080).
# Copiar para /etc/nginx/sites-available/etal, ligar em sites-enabled, ajustar o certificado e: nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name etal.nadic.ifrn.edu.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name etal.nadic.ifrn.edu.br;
    # o mesmo certificado que os outros sistemas do NADIC usam (ou o do certbot para este nome)
    ssl_certificate     /etc/letsencrypt/live/etal.nadic.ifrn.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etal.nadic.ifrn.edu.br/privkey.pem;

    # materiais de até 15 MB e publicações com até 6 fotos
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # o IP de quem acessa (substitui, não acrescenta: o que o celular mandar nesse cabeçalho é ignorado)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # avisos ao vivo (/api/ao-vivo): conexão longa, sem buffer
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
