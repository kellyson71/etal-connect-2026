# Apache do servidor → app do ETAL (contêiner web na porta PORTA do .env, aqui 8080).
# Precisa de: a2enmod proxy proxy_http headers ssl rewrite. Depois: apachectl configtest && systemctl reload apache2
<VirtualHost *:80>
    ServerName etal.nadic.ifrn.edu.br
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName etal.nadic.ifrn.edu.br
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/etal.nadic.ifrn.edu.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/etal.nadic.ifrn.edu.br/privkey.pem

    # materiais de até 15 MB e publicações com até 6 fotos
    LimitRequestBody 41943040
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # o IP de quem acessa (o que o celular mandar nesse cabeçalho é ignorado)
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    # avisos ao vivo (/api/ao-vivo): conexão longa, sem buffer
    ProxyTimeout 3600
    ProxyPass        / http://127.0.0.1:8080/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
